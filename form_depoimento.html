<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Inserir Depoimento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4">Cadastrar Novo Depoimento</h2>

  <form action="inserir_depoimento.php" method="get">
    
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" name="nome" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Mensagem</label>
      <textarea name="mensagem" class="form-control" required></textarea>

    <button class="btn btn-primary" type="submit">Salvar Depoimento</button>
  </form>

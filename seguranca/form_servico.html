<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Inserir Serviço</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4">Cadastrar Novo Serviço</h2>

  <form action="inserir_servico.php" method="get">
    
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" name="titulo" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Descrição</label>
      <textarea name="descricao" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Preço (opcional)</label>
      <input type="text" name="preco" class="form-control">
    </div>

    <div class="mb-3">
      <input type="text" name="imagem" class="form-control">
    </div>

    <button class="btn btn-primary" type="submit">Salvar Serviço</button>
  </form>

  <a href="index.php" class="btn btn-secondary mt-3">Voltar ao início</a>
</div>

</body>
</html>
